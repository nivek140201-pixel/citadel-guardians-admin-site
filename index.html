<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Play Citadel Guardians Admin Server, a 3D battlefield sandbox for summoning units, enemies, mutations, and testing battles.">
<meta name="robots" content="index,follow">
<title>Citadel Guardians Admin Server - 3D Battle Sandbox</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;overflow:hidden;background:#101820;font-family:system-ui,"Malgun Gothic",sans-serif;color:#fff}
  #game{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .panel{background:rgba(10,18,28,.9);border:1px solid rgba(255,255,255,.2);border-radius:11px;box-shadow:0 8px 26px #0007;padding:11px 13px;backdrop-filter:blur(6px)}
  #stats{position:absolute;top:12px;left:12px;line-height:1.55}
  #adminPanel{position:absolute;right:12px;top:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 92px);display:none;pointer-events:auto}
  #adminPanel.open{display:block}
  #adminPanel h2{margin:0 0 8px;color:#ffd166;font-size:18px}
  #adminPanel h3{margin:10px 0 5px;color:#ffd166;font-size:13px}
  .scroll{overflow:auto;max-height:calc(100vh - 180px);padding-right:3px}
  select,button{font:inherit}
  select{width:100%;padding:8px 9px;border-radius:7px;background:#1a2c3d;color:#fff;border:1px solid #536a7f}
  .spawnButton{width:100%;margin-top:9px;padding:9px;border:0;border-radius:8px;background:#e9a93b;color:#1c1b16;font-weight:900;cursor:pointer}
  .spawnButton:hover,#battleButton:hover{filter:brightness(1.12)}
  #panelToggle,#battleButton{position:absolute;bottom:14px;pointer-events:auto;border:1px solid #71869b;border-radius:8px;padding:10px 16px;background:#25374b;color:white;font:inherit;font-weight:800;cursor:pointer}
  #panelToggle{right:14px}
  #battleButton{left:50%;transform:translateX(-50%);background:#c44845;min-width:145px}
  #battleButton.active{background:#54b678;color:#112318}
  #message{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#111e;padding:10px 16px;border-radius:9px;font-weight:700;opacity:0;transition:opacity .2s}
  #message.show{opacity:1}
  #accessGate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,rgba(7,16,27,.96),rgba(11,17,24,.94)),radial-gradient(circle at center,#284a5b,#0b1118)}
  #accessForm{width:min(420px,100%);padding:30px;border:1px solid #62798d;border-radius:16px;background:#132231;box-shadow:0 20px 80px #0009}
  #accessForm h1{margin:0 0 8px;color:#ffd166;font-size:clamp(23px,5vw,32px)}
  #accessForm p{margin:0 0 20px;color:#d7e3ef;line-height:1.5}
  #accessForm label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#d7e3ef}
  #accessPassword{width:100%;padding:11px 12px;border:1px solid #536a7f;border-radius:8px;background:#1a2c3d;color:#fff;font:inherit}
  #accessPassword:focus{outline:2px solid #ffd166;outline-offset:2px}
  #accessSubmit{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#e9a93b;color:#1c1b16;font:inherit;font-weight:900;cursor:pointer}
  #accessError{min-height:1.3em;margin:10px 0 0!important;color:#ff8181!important;font-size:13px}
  #accessGate[hidden]{display:none}
  @media(max-width:600px){#stats{font-size:12px}#adminPanel{top:8px;right:8px;max-height:calc(100vh - 78px)}.scroll{max-height:calc(100vh - 155px)}}
</style>
</head>
<body>
<div id="accessGate">
  <form id="accessForm" autocomplete="off">
    <h1>Citadel Guardians</h1>
    <p>Enter the access password to begin.</p>
    <label for="accessPassword">Password</label>
    <input id="accessPassword" type="password" required autofocus autocomplete="current-password">
    <button id="accessSubmit" type="submit">Enter</button>
    <p id="accessError" role="status" aria-live="polite"></p>
  </form>
</div>
<div id="game"></div>
<div id="hud">
  <div id="stats" class="panel"><strong>Citadel Guardians Admin Server</strong><br>Spawned: <span id="actorCount">0</span><br>Battle: <span id="battleState">Stopped</span><br>F: Admin panel · WASD: Move</div>
  <section id="adminPanel" class="panel" aria-label="Admin summon panel">
    <h2>Admin Controls</h2>
    <div class="scroll">
      <h3>Mob or Unit</h3>
      <select id="actorSelect"></select>
      <h3>Mutation</h3>
      <select id="mutationSelect"></select>
      <h3>Level</h3>
      <select id="levelSelect"></select>
      <button id="spawnButton" class="spawnButton" type="button">Summon in front</button>
      <h3>Selected Unit</h3>
      <button id="evolveButton" class="spawnButton" type="button">Evolve selected actor</button>
      <button id="clearButton" class="spawnButton" type="button" style="background:#52677b;color:white">Clear battlefield</button>
    </div>
  </section>
  <button id="panelToggle" type="button">Admin Panel</button>
  <button id="battleButton" type="button">Start Battle</button>
  <div id="message"></div>
</div>

function box(parent,x,y,z,sx,sy,sz,material){const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;}

function makeHumanoid({shirt=materials.blue,pants=materials.black,skin=materials.skin,scale=1,weapon=true,cape=false}={}){
  const g=new THREE.Group();g.scale.setScalar(scale);
  box(g,0,1.48,0,.72,.78,.38,shirt);
  box(g,0,2.12,0,.52,.5,.48,skin);
  box(g,0,2.4,0,.54,.13,.5,materials.black);

  const leftArm=new THREE.Group();leftArm.position.set(-.42,1.82,0);g.add(leftArm);box(leftArm,0,-.34,0,.19,.7,.22,shirt);
  const rightArm=new THREE.Group();rightArm.position.set(.42,1.82,0);g.add(rightArm);box(rightArm,0,-.34,0,.19,.7,.22,shirt);
  if(weapon){box(rightArm,.13,-.12,0,.1,.72,.12,materials.darkStone);box(rightArm,.13,.23,0,.15,.1,.15,materials.gold);}
  const leftLeg=new THREE.Group();leftLeg.position.set(-.2,1.08,0);g.add(leftLeg);box(leftLeg,0,-.34,0,.27,.68,.3,pants);box(leftLeg,0,-.69,.06,.3,.16,.42,materials.darkStone);
  const rightLeg=new THREE.Group();rightLeg.position.set(.2,1.08,0);g.add(rightLeg);box(rightLeg,0,-.34,0,.27,.68,.3,pants);box(rightLeg,0,-.69,.06,.3,.16,.42,materials.darkStone);
  if(cape){const c=box(g,0,1.48,-.27,.55,.72,.08,materials.red);c.rotation.x=-.1;}
  g.userData.limbs={leftArm,rightArm,leftLeg,rightLeg};return g;
}
function makeHorse(parent,coat){
  sphere(parent,0,.92,-.12,.66,.48,1.05,coat);
  sphere(parent,0,1.35,.67,.3,.52,.34,coat);
  sphere(parent,0,1.72,.92,.3,.36,.38,coat);
  sphere(parent,0,1.93,1.05,.27,.12,.32,materials.black);
  const legs=[];
  for(const x of [-.42,.42])for(const z of [-.78,.52]){
    const pivot=new THREE.Group();pivot.position.set(x,.81,z);parent.add(pivot);
    const leg=box(pivot,0,-.39,0,.16,.78,.18,coat);leg.rotation.x=z>0?-.08:.08;legs.push(pivot);
  }
  const tail=box(parent,0,1.08,-1.12,.12,.62,.12,materials.black);tail.rotation.x=-.5;
  parent.userData.legs=legs;
}
function makeMountedHumanoid(options,saddle=materials.red,spear=materials.gold){
  const root=new THREE.Group(),horse=new THREE.Group();makeHorse(horse,saddle);root.add(horse);
  const rider=makeHumanoid(options);rider.position.y=.62;root.add(rider);root.userData.limbs=rider.userData.limbs;root.userData.horse=horse;
  const lance=cylinder(root,.57,2.25,.25,.045,.045,2.1,spear,6);lance.rotation.x=-Math.PI/2.5;return root;
}
function makeMechaUnit(type,color){
  const armor=new THREE.MeshStandardMaterial({color,metalness:.72,roughness:.3}),glow=new THREE.MeshStandardMaterial({color:0x8beeff,emissive:0x286a83,emissiveIntensity:1.2,metalness:.35,roughness:.25});
  if(type==='mechWolf'){
    const wolf=new THREE.Group();
    const wolfLegs=[];
    box(wolf,0,1.08,-.08,1.15,.62,1.75,armor);
    box(wolf,0,1.32,.93,.78,.62,.75,armor);
    box(wolf,0,1.43,1.42,.68,.38,.48,armor);
    for(const x of [-.3,.3]){box(wolf,x,1.48,1.68,.1,.1,.04,glow);const ear=new THREE.Mesh(new THREE.ConeGeometry(.15,.55,5),armor);ear.position.set(x,1.92,1.35);wolf.add(ear);}
    for(const x of [-.43,.43])for(const z of [-.63,.58]){
      const leg=box(wolf,x,.48,z,.24,.86,.27,armor);leg.rotation.x=z>0?-.12:.12;
      wolfLegs.push(leg);
      box(wolf,x,.14,z+.12,.34,.18,.46,materials.darkStone);
    }
    const tail=box(wolf,0,1.4,-1.12,.16,.18,.86,armor);tail.rotation.x=-.48;
    for(const z of [-.35,.2])box(wolf,0,1.42,z,.28,.13,.14,glow,false);
    wolf.userData.wolfLegs=wolfLegs;
    return wolf;
  }
  const scale=type==='mechGolem'?1.25:1;
  const unit=makeHumanoid({shirt:armor,pants:armor,skin:armor,scale,weapon:false,cape:false});
  for(const x of [-.42,.42]){
    const shoulder=new THREE.Mesh(new THREE.DodecahedronGeometry(.34,0),armor);shoulder.position.set(x,1.91,0);unit.add(shoulder);
    const gauntlet=box(unit,x*.95,1.35,.02,.3,.34,.34,armor);gauntlet.rotation.z=x*.12;
  }
  box(unit,0,1.5,.23,.48,.2,.08,glow,false);
  if(type==='mechKnight'||type==='fireKnight'||type==='electricKnight'){
    const blade=cylinder(unit,.58,1.45,.05,.07,.07,1.65,type==='fireKnight'?materials.fire:type==='electricKnight'?materials.electric:materials.gold,6);blade.rotation.z=-.12;
  }
  if(type==='mechGolem'){
    for(let i=0;i<6;i++){
      const shard=new THREE.Mesh(new THREE.DodecahedronGeometry(.34+(i%2)*.1,0),armor);shard.position.set(i%2?-.48:.48,1.15+(i%3)*.52,i%3?-.17:.22);unit.add(shard);
    }
  }
  return unit;
}
function makeArcher(){

    new THREE.Vector3(.26,.38,0),new THREE.Vector3(0,.58,0)

  const bow=new THREE.Mesh(new THREE.TubeGeometry(curve,18,.045,6,false),materials.wood);bow.castShadow=true;bowGroup.add(bow);
  const string=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-.58,.015),new THREE.Vector3(0,.58,.015)]),new THREE.LineBasicMaterial({color:0xe6dcc4}));
  bowGroup.add(string);
  box(g,.28,1.68,-.3,.28,.62,.2,materials.wood);

    fletching.rotation.z=.12;
  }
  return g;
}

const actorSelect=document.getElementById('actorSelect'),mutationSelect=document.getElementById('mutationSelect'),levelSelect=document.getElementById('levelSelect');
function addOption(select,value,label,groupName){
  let group=select.querySelector(`optgroup[label="${groupName}"]`);
  if(!group){group=document.createElement('optgroup');group.label=groupName;select.appendChild(group);}
  const option=document.createElement('option');option.value=value;option.textContent=label;group.appendChild(option);
}

  const facing=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw)),right=new THREE.Vector3(-facing.z,0,facing.x);
  const teamCount=actors.filter(actor=>!actor.dead&&actor.isUnit===isUnit).length,column=(teamCount%5)-2,row=Math.floor(teamCount/5);
  const forwardDistance=isUnit?5.5:20;
  const placement=player.position.clone().addScaledVector(facing,forwardDistance+row*2.7).addScaledVector(right,column*2.5);
  placement.x=THREE.MathUtils.clamp(placement.x,-76,76);placement.z=THREE.MathUtils.clamp(placement.z,-76,76);
  mesh.position.copy(placement);mesh.rotation.y=Math.atan2(-facing.x,-facing.z);
  const mutationData=mutation.id==='none'?null:mutation;
  const multiplier=mutationData;
  let maxHp=def.hp*(multiplier?multiplier.hp:1),attack=def.atk*(multiplier?multiplier.attack:1),defense=def.def+(multiplier?multiplier.def:0);
  if(evolved){maxHp*=1.5;attack*=1.5;defense+=4;}
  else{const factor=1+.2*(level-1);maxHp*=factor;attack*=factor;defense+=level-1;}
  scene.add(mesh);decorateMutation(mesh,mutationData);
  const color=mutationData?mutationData.color:def.boss?0xff7373:0xeaf3fa;
  const label=makeTag(`${mutationData?mutationData.name+' ':''}${def.name}${evolved?' · Evolved':level>1?' · Lv '+level:''}`,color);scene.add(label);
  const bar=makeHealthBar();scene.add(bar);
  const actor={def,mesh,mutation:mutationData,hp:maxHp,maxHp,attack,defense,speed:def.speed,range:def.range,cooldown:def.cool||1,attackTimer:Math.random(),bar,label,isUnit,level,evolved,dead:false};
  if(evolved){const old=actor.mesh;actor.mesh=makeEvolvedForm(actor);actor.mesh.position.copy(placement);actor.mesh.rotation.y=Math.atan2(-facing.x,-facing.z);scene.remove(old);scene.add(actor.mesh);}
  if(def.id==='fireZombie'||def.id==='fireKnight')actor.burnDamage=0;
  actors.push(actor);selectedAlly=actor;updateSelection();updateHUD();
  notify(`${mutationData?mutationData.name+' ':''}${def.name} summoned ${evolved?'at Evolve level':'at level '+level}.`);
}
function updateHUD(){document.getElementById('actorCount').textContent=actors.filter(actor=>!actor.dead).length;document.getElementById('battleState').textContent=battleActive?'Running':'Stopped';}
function updateSelection(){
  const selectedDef=[...actorDefs.mobs,...actorDefs.units].find(item=>item.id===actorSelect.value);
  levelSelect.disabled=!selectedDef||!actorDefs.units.includes(selectedDef);
  document.getElementById('evolveButton').disabled=!selectedAlly||!selectedAlly.isUnit||selectedAlly.evolved;
  document.getElementById('evolveButton').textContent=selectedAlly?.evolved?'Selected actor evolved':'Evolve selected actor';
}
function updatePositionTags(){
  for(const actor of actors){
    if(actor.dead)continue;
    const height=actor.def.boss?actor.def.scale*3.1:actor.mesh.userData.horse?4.1:3.1;
    actor.bar.position.set(actor.mesh.position.x,actor.mesh.position.y+height,actor.mesh.position.z);actor.bar.lookAt(camera.position);
    actor.label.position.set(actor.mesh.position.x,actor.mesh.position.y+height+.48,actor.mesh.position.z);updateHealthBar(actor);
  }
}
function damage(actor,amount){actor.hp=Math.max(0,actor.hp-Math.max(1,amount-actor.defense));if(actor.hp<=0)actor.dead=true;}
function playAttack(actor,target){
  actor.mesh.userData.attackSwing=1;
  const a=actor.def,b=target.def;
  if(a.id==='medic'){
    const allies=actors.filter(item=>item.isUnit&&!item.dead&&item.hp<item.maxHp&&item.mesh.position.distanceTo(actor.mesh.position)<7);
    if(allies.length){const healed=allies.sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0];healed.hp=Math.min(healed.maxHp,healed.hp+12);return;}
  }
  damage(target,actor.attack);
  if(a.id==='archer'||a.id==='mage')createProjectile(actor.mesh.position,target.mesh.position,a.id==='archer'?0x91f2aa:0xb78cff,a.id==='archer');
  else createSlash(actor.mesh,target.mesh.position,actor.mutation?.color||0xffdf7a);
  if(a.id==='fireKnight')for(const enemy of actors)if(!enemy.isUnit&&!enemy.dead&&enemy!==target&&enemy.mesh.position.distanceTo(target.mesh.position)<3.2)damage(enemy,actor.attack*.45);
  if(a.id==='electricKnight')for(const enemy of actors)if(!enemy.isUnit&&!enemy.dead&&enemy!==target&&enemy.mesh.position.distanceTo(target.mesh.position)<4)damage(enemy,actor.attack*.35);
}
function findTarget(actor){
  let best=null,dist=Infinity;
  for(const other of actors){
    if(other===actor||other.dead||other.isUnit===actor.isUnit)continue;
    const d=actor.mesh.position.distanceTo(other.mesh.position);
    if(d<dist){best=other;dist=d;}
  }
    return best;
  }
  function combatRange(actor){
    if(actor.range>7)return actor.def.id==='archer'?9:8;
    return actor.range;
  }
  function animateActor(actor,dt,moving){
    const mesh=actor.mesh,limbs=mesh.userData.limbs;
    mesh.userData.walkPhase=(mesh.userData.walkPhase||0)+(moving?dt*8:0);
    const phase=mesh.userData.walkPhase,swing=moving?Math.sin(phase)*.58:0,attack=mesh.userData.attackSwing||0;
    mesh.userData.attackSwing=Math.max(0,attack-dt*3.8);
    if(limbs){
      limbs.leftArm.rotation.x=swing;limbs.rightArm.rotation.x=-swing-Math.sin((1-attack)*Math.PI)*1.25;
      limbs.rightArm.rotation.z=attack>0?-.3:0;limbs.leftLeg.rotation.x=-swing;limbs.rightLeg.rotation.x=swing;
    }
    if(mesh.userData.horse){
      const horse=mesh.userData.horse,legs=horse.userData.legs||[];
      horse.position.y=moving?Math.abs(Math.sin(phase*2))*.08:0;
      legs.forEach((leg,index)=>{leg.rotation.x=moving?Math.sin(phase+(index%2)*Math.PI)*.52:0;});
    }
    if(mesh.userData.wolfLegs)mesh.userData.wolfLegs.forEach((leg,index)=>{leg.rotation.x=moving?Math.sin(phase+(index%2)*Math.PI)*.38:0;});
    if(mesh.userData.mutationAura)mesh.userData.mutationAura.rotation.y+=dt*(moving?1.8:.7);
    if(mesh.userData.aura?.group)mesh.userData.aura.group.rotation.y+=dt*(moving?1.8:.7);
  }
function createSlash(source,target,color){
  const points=[source.position.clone().add(new THREE.Vector3(0,1.3,0)),target.clone().add(new THREE.Vector3(0,1,0))];
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));
  scene.add(line);setTimeout(()=>{scene.remove(line);line.geometry.dispose();line.material.dispose();},180);
}
function createProjectile(from,to,color,arrow=false){
  const group=new THREE.Group();
  if(arrow){const shaft=cylinder(group,0,0,0,.035,.035,.8,materials.wood,6);shaft.rotation.x=Math.PI/2;}
  else group.add(new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),new THREE.MeshBasicMaterial({color})));
  const start=from.clone().add(new THREE.Vector3(0,1.6,0)),end=to.clone().add(new THREE.Vector3(0,1,0));
  group.position.copy(start);group.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),end.clone().sub(start).normalize());scene.add(group);
  const begin=performance.now(),duration=360;
  function animate(){const t=Math.min(1,(performance.now()-begin)/duration);group.position.lerpVectors(start,end,t);if(t<1)requestAnimationFrame(animate);else{scene.remove(group);group.traverse(object=>{if(object.geometry)object.geometry.dispose();});}}
  requestAnimationFrame(animate);
}
function updateBattle(dt){
  playerCooldown=Math.max(0,playerCooldown-dt);
  if(playerHp<playerMaxHp)playerHp=Math.min(playerMaxHp,playerHp+dt);
  for(const actor of actors){
    if(actor.dead)continue;
    actor.attackTimer-=dt;
    if(actor.isUnit&&actor.def.id==='medic'){
      const wounded=actors.filter(item=>item.isUnit&&!item.dead&&item.hp<item.maxHp&&item.mesh.position.distanceTo(actor.mesh.position)<7).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
      if(wounded&&actor.attackTimer<=0){wounded.hp=Math.min(wounded.maxHp,wounded.hp+12);createSlash(actor.mesh,wounded.mesh.position,0x55ff91);actor.attackTimer=actor.cooldown;}
      const front=findTarget(actor),frontDist=front?actor.mesh.position.distanceTo(front.mesh.position):Infinity;
      if(front&&frontDist>5){const direction=front.mesh.position.clone().sub(actor.mesh.position);direction.y=0;direction.normalize();actor.mesh.position.addScaledVector(direction,Math.min(actor.speed*dt,frontDist-5));actor.mesh.rotation.y=Math.atan2(direction.x,direction.z);animateActor(actor,dt,true);}
      else animateActor(actor,dt,false);
      continue;
    }
    const target=findTarget(actor);if(!target){animateActor(actor,dt,false);continue;}
    const pos=actor.mesh.position,targetPos=target.mesh.position,dist=pos.distanceTo(targetPos);
    const reach=combatRange(actor);
    if(dist>reach){const direction=targetPos.clone().sub(pos);direction.y=0;direction.normalize();pos.addScaledVector(direction,Math.min(actor.speed*dt,dist-reach));actor.mesh.rotation.y=Math.atan2(direction.x,direction.z);animateActor(actor,dt,true);}
    else{animateActor(actor,dt,false);if(actor.attackTimer<=0){playAttack(actor,target);actor.attackTimer=actor.cooldown;}}
  }
  for(let i=actors.length-1;i>=0;i--)if(actors[i].dead){scene.remove(actors[i].mesh);scene.remove(actors[i].bar);scene.remove(actors[i].label);actors.splice(i,1);if(selectedAlly?.dead)selectedAlly=null;}
}
function evolvedSelected(){
  if(!selectedAlly){notify('Select an actor first.');return;}
  if(!selectedAlly.isUnit){notify('Only units can evolve.');return;}
  if(selectedAlly.evolved){notify('This unit is already evolved.');return;}
  const actor=selectedAlly,old=actor.mesh,position=old.position.clone(),rotation=old.rotation.clone();
  actor.evolved=true;actor.level=5;actor.maxHp=Math.round(actor.maxHp*1.5);actor.hp=actor.maxHp;actor.attack=Math.round(actor.attack*1.5);actor.defense+=4;
  actor.mesh=makeEvolvedForm(actor);actor.mesh.position.copy(position);actor.mesh.rotation.copy(rotation);scene.remove(old);scene.add(actor.mesh);
  actor.label.material.map?.dispose();scene.remove(actor.label);actor.label=makeTag(`${actor.mutation?actor.mutation.name+' ':''}${actor.def.name} · Evolved`,actor.mutation?.color||0xffdf7a);scene.add(actor.label);
  notify(`${actor.def.name} evolved!`);updateSelection();
}
function clearActors(){
  for(const actor of actors){scene.remove(actor.mesh);scene.remove(actor.bar);scene.remove(actor.label);}
  actors.length=0;selectedAlly=null;updateSelection();updateHUD();
}
function toggleBattle(){
  battleActive=!battleActive;
  const button=document.getElementById('battleButton');button.classList.toggle('active',battleActive);button.textContent=battleActive?'Stop Battle':'Start Battle';
  document.getElementById('battleState').textContent=battleActive?'Running':'Stopped';
}
function updatePlayer(dt){
  const forward=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw)),right=new THREE.Vector3(-Math.cos(cameraYaw),0,Math.sin(cameraYaw)),v=new THREE.Vector3();
  if(keys.w||keys.arrowup)v.add(forward);if(keys.s||keys.arrowdown)v.sub(forward);if(keys.d||keys.arrowright)v.add(right);if(keys.a||keys.arrowleft)v.sub(right);
  if(!panelOpen&&v.lengthSq()){v.normalize();player.position.addScaledVector(v,8*dt);player.rotation.y=Math.atan2(v.x,v.z);walkPhase+=dt*9;const limbs=player.userData.limbs;limbs.leftArm.rotation.x=Math.sin(walkPhase)*.5;limbs.rightArm.rotation.x=-Math.sin(walkPhase)*.5;limbs.leftLeg.rotation.x=-Math.sin(walkPhase)*.5;limbs.rightLeg.rotation.x=Math.sin(walkPhase)*.5;}
  player.position.x=THREE.MathUtils.clamp(player.position.x,-78,78);player.position.z=THREE.MathUtils.clamp(player.position.z,-78,78);
}
function updateCamera(dt){
  const horizontal=Math.cos(cameraPitch)*cameraDistance;
  const desired=new THREE.Vector3(player.position.x-Math.sin(cameraYaw)*horizontal,Math.max(.85,player.position.y+2.2+Math.sin(cameraPitch)*cameraDistance),player.position.z-Math.cos(cameraYaw)*horizontal);
  camera.position.lerp(desired,1-Math.exp(-14*dt));camera.lookAt(player.position.x,player.position.y+1.55,player.position.z);
}
document.addEventListener('keydown',event=>{
  if(!accessGranted)return;
  const key=event.key.toLowerCase();keys[key]=true;
  if(key==='f'){panelOpen=!panelOpen;document.getElementById('adminPanel').classList.toggle('open',panelOpen);if(document.pointerLockElement)document.exitPointerLock?.();event.preventDefault();}
  if(key==='escape'&&panelOpen){panelOpen=false;document.getElementById('adminPanel').classList.remove('open');}
  if(key==='e'&&selectedAlly)evolvedSelected();
});
document.addEventListener('keyup',event=>{keys[event.key.toLowerCase()]=false;});
renderer.domElement.addEventListener('pointerdown',event=>{if(event.button===0&&!panelOpen&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock?.();});
renderer.domElement.addEventListener('contextmenu',event=>event.preventDefault());
document.addEventListener('mousemove',event=>{if(document.pointerLockElement===renderer.domElement){cameraYaw-=event.movementX*.0031;cameraPitch=THREE.MathUtils.clamp(cameraPitch-event.movementY*.0028,-.16,1.48);}});
document.addEventListener('wheel',event=>{cameraDistance=THREE.MathUtils.clamp(cameraDistance+Math.sign(event.deltaY)*1.1,6.5,28);},{passive:true});
document.getElementById('panelToggle').addEventListener('click',()=>{panelOpen=!panelOpen;document.getElementById('adminPanel').classList.toggle('open',panelOpen);});
document.getElementById('spawnButton').addEventListener('click',spawnActor);
document.getElementById('battleButton').addEventListener('click',toggleBattle);
document.getElementById('clearButton').addEventListener('click',clearActors);
document.getElementById('evolveButton').addEventListener('click',evolvedSelected);
document.getElementById('adminPanel').addEventListener('click',event=>{const option=event.target.closest('option');if(option?.dataset.actorId){selectedAlly=actors.find(actor=>actor.def.id===option.dataset.actorId)||null;updateSelection();}});
actorSelect.addEventListener('change',()=>{selectedAlly=null;updateSelection();});
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',event=>{
  if(panelOpen)return;
  pointer.x=event.clientX/innerWidth*2-1;pointer.y=-(event.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);
  const selectable=actors.filter(actor=>!actor.dead),hits=raycaster.intersectObjects(selectable.flatMap(actor=>{const meshes=[];actor.mesh.traverse(object=>{if(object.isMesh)meshes.push(object);});return meshes;}),false);
  if(hits.length){selectedAlly=selectable.find(actor=>{let found=false;actor.mesh.traverse(object=>{if(object===hits[0].object)found=true;});return found;})||null;updateSelection();}
});
function frame(time=0){
  requestAnimationFrame(frame);const dt=Math.min(.04,(time-lastTime)/1000||.016);lastTime=time;elapsed+=dt;
  updatePlayer(dt);if(battleActive)updateBattle(dt);updatePositionTags();updateCamera(dt);renderer.render(scene,camera);
}
document.getElementById('evolveButton').disabled=true;
updateSelection();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
updateHUD();frame();
</script>
